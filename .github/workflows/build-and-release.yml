name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          mkdir -p release-assets
          # Locate built APK
          BUILT_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ] || [ ! -f "$BUILT_APK" ]; then
            echo "Error: Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$BUILT_APK" release-assets/LogoGenAI-debug.apk
          echo "apk_path=release-assets/LogoGenAI-debug.apk" >> $GITHUB_OUTPUT
          ls -la release-assets/LogoGenAI-debug.apk

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: release-assets/LogoGenAI-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Run gh --version and verify GitHub CLI is available
          echo "Verifying GitHub CLI availability..."
          gh --version || { echo "Error: GitHub CLI (gh) is not available"; exit 1; }

          # 2. Confirm the prepared release asset exists
          RELEASE_ASSET="release-assets/LogoGenAI-debug.apk"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "Error: Prepared release asset '$RELEASE_ASSET' does not exist."
            exit 1
          fi

          # 3. Confirm the release asset is a .apk file
          if [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "Error: Release asset '$RELEASE_ASSET' is not a .apk file."
            exit 1
          fi

          # 4. Confirm the release asset is a non-empty file
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Release asset '$RELEASE_ASSET' is empty (0 bytes)."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$RELEASE_ASSET" 2>/dev/null || stat -f%z "$RELEASE_ASSET" 2>/dev/null || wc -c < "$RELEASE_ASSET")
          echo "APK Validation succeeded: $RELEASE_ASSET (Size: $FILE_SIZE bytes)"

          # 5. Construct dynamic unique release tag and title
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          echo "Target Release Tag: $TAG_NAME"
          echo "Release Title: $RELEASE_TITLE"
          echo "Target Commit: $TARGET_COMMIT"

          # 6. Compose clear release notes
          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build Notice

          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF
          )

          # 7. Create published release attaching only the prepared .apk file
          echo "Publishing release via gh release create..."
          gh release create "$TAG_NAME" \
            "$RELEASE_ASSET" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "Successfully published release $TAG_NAME with asset $(basename "$RELEASE_ASSET")"
